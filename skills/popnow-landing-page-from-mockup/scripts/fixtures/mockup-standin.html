<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mockup stand-in</title>
<!-- Stand-in for a generated mockup image in self-tests: same sections as clean.html,
     but the hero is a dark full-bleed band with a centered headline, so the compare
     step has real differences to report. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1440px; background: #F7F5F0; color: #22261F; font: 17px/1.55 Georgia, serif; }
  .wrap { width: 1120px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; padding: 20px 0; }
  .hero { background: #2F3A2C; color: #F3F1EA; text-align: center; padding: 140px 0 160px; }
  .hero h1 { font-size: 76px; margin: 0 0 20px; }
  .accent { display: inline-block; background: #D9822B; color: #1b1b1b; padding: 14px 22px; border-radius: 6px; }
  .facts { display: flex; gap: 48px; padding: 48px 0; font-size: 22px; }
  .features { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 32px; padding: 72px 0; }
  .features div { height: 220px; background: #E6E1D5; }
  .pricing { padding: 48px 0 120px; }
  .pricing div { height: 120px; border-bottom: 1px solid #E2E0D8; }
  footer { padding: 32px 0; color: #555D50; }
</style>
</head>
<body>
<div class="wrap"><header><strong>Tallyroom</strong><span>How it works · Pricing</span></header></div>
<section class="hero"><h1>Split the bills, keep the peace</h1><p>Log a cost in two taps.</p><span class="accent">Start a household</span></section>
<div class="wrap">
  <div class="facts"><span>No ads, ever</span><span>Data export any time</span><span>Works offline</span></div>
  <div class="features"><div></div><div></div><div></div></div>
  <div class="pricing"><div></div><div></div></div>
  <footer>© 2026 Tallyroom</footer>
</div>
</body>
</html>
