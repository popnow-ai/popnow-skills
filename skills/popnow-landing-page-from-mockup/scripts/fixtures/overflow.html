<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overflow fixture</title>
<meta name="description" content="A page that scrolls sideways on phones, for the self-test.">
<style>
  body { margin: 0; font: 16px/1.5 Georgia, serif; background: #fff; color: #222; }
  .wide { width: 720px; padding: 16px; background: #eee; }
  .faint { color: #bbb; }
  a.tiny { display: inline-block; width: 18px; height: 18px; background: #333; }
</style>
</head>
<body>
<h1>Overflow fixture</h1>
<div class="wide">This box is wider than a phone screen.</div>
<p class="faint">This grey text is too light to read on white.</p>
<nav><a class="tiny" href="#x" aria-label="Tiny target"></a></nav>
<img src="missing-file.png" alt="A file that does not exist">
</body>
</html>
