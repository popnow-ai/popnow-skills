name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile skills/*/scripts/*.py tools/*.py tests/*.py
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: English only
        run: |
          if git grep -nIP '[\x{4e00}-\x{9fff}\x{3040}-\x{30ff}\x{ac00}-\x{d7af}]'; then
            echo "Non-English characters found"; exit 1
          fi
